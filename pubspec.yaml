name: vaastu_pmc
description: Vaastu PMC – Construction Project Management Suite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── WebView ───────────────────────────────────────────────────
  webview_flutter: ^4.8.0
  webview_flutter_android: ^3.16.0
  webview_flutter_wkwebview: ^3.14.0

  # ── GPS ───────────────────────────────────────────────────────
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # ── Camera / File picker ──────────────────────────────────────
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Push Notifications (FCM) ──────────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2

  # ── Biometric ─────────────────────────────────────────────────
  local_auth: ^2.3.0

  # ── Secure Storage ────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # ── HTTP ──────────────────────────────────────────────────────
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # ── UI helpers ────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0+3

  # ── Deep links (notification tap routing) ────────────────────
  app_links: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# ── App icon config ───────────────────────────────────────────
flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/vaastu_logo.png"
  adaptive_icon_background: "#F97316"
  adaptive_icon_foreground: "assets/icons/vaastu_logo.png"
  min_sdk_android: 21
  web:
    generate: false

# ── Splash screen config ──────────────────────────────────────
flutter_native_splash:
  color: "#F97316"
  image: assets/images/splash_logo.png
  color_dark: "#F97316"
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#F97316"
    image: assets/images/splash_logo.png
    icon_background_color: "#F97316"
  fullscreen: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
